<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometrical — Mantenimiento</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #0e0e10, #060606);
      color: #f3f3f3;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      color: #b5b5b5;
      margin-bottom: 2rem;
      max-width: 600px;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 6px solid #222;
      border-top: 6px solid #e50914;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.8rem;
      color: #666;
    }
    footer a {
      color: #458888;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h1> Sitio en mantenimiento</h1>
  <p>Estamos trabajando en mejoras para ofrecerte una mejor experiencia.<br/>
  Vuelve pronto o contáctanos si necesitas asistencia urgente.</p>
  <footer>
    © 2025 Isometrical Game Company · <a href="miguelacaceresrios@gmail.com">miguelacaceresrios@gmail.com</a>
  </footer>
</body>
</html>
